<div class="modal" id="confirmModal" hidden>
    <div class="modal-backdrop" data-answer="no"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <span class="modal-icon" id="modalIcon">
            <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
        </span>
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <div class="modal-actions">
            <button type="button" class="btn btn-light" data-answer="no" id="modalNo">Cancel</button>
            <button type="button" class="btn btn-primary" data-answer="yes" id="modalYes">OK</button>
        </div>
    </div>
</div>
