{% extends "base.html" %}

{% block title %}Sign up - KandyTrail{% endblock %}

{% block content %}
<form class="login-card account-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h1>Create an account</h1>
    <p>Save your trips and share them with other travellers.</p>

    {% for error in errors %}<p class="form-error">{{ error }}</p>{% endfor %}

    <label class="field">
        <span>Your name</span>
        <input type="text" name="full_name" value="{{ request.form.full_name }}" maxlength="100" required autofocus autocomplete="name">
    </label>
    <label class="field">
        <span>Email</span>
        <input type="email" name="email" value="{{ request.form.email }}" maxlength="150" required autocomplete="email">
    </label>
    <label class="field">
        <span>Password <small>at least 8 characters</small></span>
        <input type="password" name="password" minlength="8" required autocomplete="new-password">
    </label>
    <label class="field">
        <span>Confirm password</span>
        <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary">Sign up</button>
    <p class="account-switch">Already have an account?
        <a href="{{ url_for('accounts.login', next=request.args.next) }}">Sign in</a>
    </p>
</form>
{% endblock %}
