{% extends "base.html" %}

{% block title %}Sign in - KandyTrail{% endblock %}

{% block content %}
<form class="login-card account-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h1>Welcome back</h1>
    <p>Sign in to save your trips.</p>

    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <label class="field">
        <span>Email</span>
        <input type="email" name="email" value="{{ request.form.email }}" required autofocus autocomplete="email">
    </label>
    <label class="field">
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="check-row">
        <input type="checkbox" name="remember" value="1" {% if request.form.remember %}checked{% endif %}>
        <span>Keep me signed in</span>
    </label>
    <button type="submit" class="btn btn-primary">Sign in</button>
    <p class="account-switch">New to KandyTrail?
        <a href="{{ url_for('accounts.register', next=request.args.next) }}">Create an account</a>
    </p>
</form>
{% endblock %}
